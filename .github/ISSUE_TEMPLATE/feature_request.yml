name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem and your proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's the pain point?
      placeholder: "When I'm shopping, I often..."
    required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
      placeholder: "Add a button that..."
    required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought of?
      placeholder: "Could also..."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, etc.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This fits the app's scope (offline, personal, localStorage)
          required: true
        - label: I'm willing to implement this or help test it
          required: false