name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: What version or commit are you on? (run `git rev-parse --short HEAD`)
      placeholder: "e.g. a1b2c3d"
    required: true
  - type: input
    id: browser
    attributes:
      label: Browser / Device
      description: What browser and device are you using?
      placeholder: "e.g. iOS Safari 17, Chrome 120 on Android, Firefox 119"
    required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Clear steps to reproduce the issue
      placeholder: |
        1. Go to...
        2. Tap...
        3. See error...
    required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens?
    required: true
  - type: textarea
    id: logs
    attributes:
      label: Console logs / screenshots
      description: Paste any relevant console errors or attach screenshots
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and this isn't a duplicate
          required: true
        - label: I can reproduce this on the latest `dev` branch
          required: true